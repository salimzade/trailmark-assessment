<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trailmark - Trail Records Admin</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Trail Records Manager</h1>
            <p class="subtitle">Manage hiking and outdoor trail records</p>
        </header>

        <div class="controls-section">
            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    class="search-input"
                    placeholder="Search by trail name..."
                    aria-label="Search trails by name"
                    data-role="search"
                >
            </div>
            <button id="addButton" class="btn btn-primary" data-role="add">
                Add New Trail
            </button>
        </div>

        <div id="trailList" class="trail-list" data-role="trail-list">
            <!-- Trail records will be rendered here -->
        </div>

        <div id="formModal" class="modal hidden" data-role="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <div class="modal-content">
                <button type="button" class="modal-close" data-role="modal-close" aria-label="Close">&times;</button>
                <h2 id="modalTitle">Add Trail Record</h2>
                <form id="trailForm" data-role="trail-form">
                    <div class="form-group">
                        <label for="trailName">Trail Name</label>
                        <input
                            type="text"
                            id="trailName"
                            name="trailName"
                            class="form-input"
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label for="location">Location</label>
                        <input
                            type="text"
                            id="location"
                            name="location"
                            class="form-input"
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label for="difficulty">Difficulty Level</label>
                        <select id="difficulty" name="difficulty" class="form-input" required>
                            <option value="">-- Select --</option>
                            <option value="Easy">Easy</option>
                            <option value="Moderate">Moderate</option>
                            <option value="Hard">Hard</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="distance">Distance (km)</label>
                        <input
                            type="number"
                            id="distance"
                            name="distance"
                            class="form-input"
                            step="0.1"
                            min="0"
                            required
                        >
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-success">Save Trail</button>
                        <button type="button" class="btn btn-secondary" data-role="modal-close">
                            Cancel
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="seed-data.js"></script>
    <script src="app.js"></script>
</body>
</html>
